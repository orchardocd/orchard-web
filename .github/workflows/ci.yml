name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # The Playwright image ships the browsers, so CI never downloads one.
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: file:./web.db
      PAYLOAD_SECRET: ci-only-secret
      PAYLOAD_ADMIN_EMAIL: admin@example.com
      PAYLOAD_ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm dup
      - run: pnpm seed
      - run: pnpm build

      - name: Tests
        timeout-minutes: 10
        run: pnpm test

      - name: Content parity with the previous site
        timeout-minutes: 10
        run: |
          python3 -m pip install --quiet beautifulsoup4 lxml
          pnpm start -H 127.0.0.1 &
          npx --yes wait-on http://127.0.0.1:3000 -t 120000
          pnpm parity
