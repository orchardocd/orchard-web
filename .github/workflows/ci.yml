name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: file:./web.db
      PAYLOAD_SECRET: ci-only-secret
      PAYLOAD_ADMIN_EMAIL: admin@example.com
      PAYLOAD_ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm dup
      - run: pnpm seed
      - run: pnpm build

      - name: Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf ../app.tar.gz .next/standalone .next/static public

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: app
          retention-days: 1
          path: app.tar.gz

      - name: Tests
        timeout-minutes: 10
        run: pnpm test

      - name: Lighthouse
        timeout-minutes: 15
        run: |
          HOSTNAME=127.0.0.1 pnpm start &
          npx --yes wait-on http://127.0.0.1:3000 -t 120000
          pnpm lighthouse

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          PREBUILT: '1'
        run: |
          tar -xzf app.tar.gz -C web
          install -m 600 /dev/null infra/deploy_key
          printf '%s\n' "$DEPLOY_KEY" > infra/deploy_key
          infra/deploy.sh
